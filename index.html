<style>
:root{
  --paper:#F3F2EC; --paper2:#EDEBE2; --ink:#22242C; --soft:#5E6270; --faint:#8E9098; --rule:#D5D2C4;
  --known:#4F7A48; --shaky:#B4772A; --hit:#A87C2B;
  --display:"Spectral",Georgia,serif; --label:"Archivo Narrow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--label);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---------- bar ---------- */
#bar{position:fixed;z-index:60;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:rgba(243,242,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);overflow-x:auto}
#bar .brand{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
#bar .brand em{font-style:italic;font-weight:300;color:var(--soft)}
.sep{width:1px;height:22px;background:var(--rule);flex:none}
.g{display:flex;align-items:center;gap:5px;flex:none}
button,.chip{font:600 11.5px/1 var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);
  background:transparent;border:1px solid var(--rule);border-radius:2px;padding:6px 8px;cursor:pointer;white-space:nowrap}
button:hover,.chip:hover{border-color:var(--soft);color:var(--ink)}
button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid #35657F;outline-offset:2px}
.chip.on,button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#q{font:400 13px var(--label);color:var(--ink);background:transparent;border:none;border-bottom:1px solid var(--rule);padding:6px 2px;width:170px;flex:none}
#qn{font:600 11px var(--label);color:var(--faint);white-space:nowrap;min-width:52px}
.lbl{font:600 10px/1 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);white-space:nowrap}

/* ---------- stage ---------- */
#stage{position:fixed;inset:52px 0 0 0;overflow:hidden;
  opacity:0;transition:opacity .2s ease;animation:revealStage 0s linear 3s forwards}
@keyframes revealStage{to{opacity:1}}
body.ready #stage{opacity:1;animation:none}
#wall{position:absolute;inset:0;overflow:hidden;cursor:grab;
  background:radial-gradient(120% 90% at 50% 45%,#F7F6F1 0%,var(--paper) 55%,var(--paper2) 100%)}
#wall.drag{cursor:grabbing}
#wall{touch-action:none}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0}
/* text stays selectable, exactly as on a normal page; selection is only
   suppressed for the duration of an actual pan so dragging doesn't smear blue */
body.panning #canvas{user-select:none;-webkit-user-select:none}

#grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right,rgba(90,96,118,.055) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(90,96,118,.055) 1px,transparent 1px);
  background-size:120px 120px}
#edges{position:absolute;inset:0;pointer-events:none}
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:24px 16px 80px}
body[data-view="column"] #wall{display:none}
body[data-view="column"] #scroller{display:block}
body[data-view="index"]  #wall{display:none}
body[data-view="index"]  #scroller{display:block}

/* ---------- root ---------- */
#root{position:absolute;text-align:center;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--paper),0 0 0 7px var(--rule)}
#root .k{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--soft)}
#root h1{font-family:var(--display);font-weight:700;font-size:33px;line-height:1.05;margin:9px 0 6px}
#root .s{font-family:var(--display);font-style:italic;font-weight:300;font-size:14px;color:var(--soft)}

/* ---------- cards ---------- */
.card{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--c);
  box-shadow:0 1px 0 rgba(34,36,44,.05),0 10px 24px -18px rgba(34,36,44,.5)}
#canvas .card{position:absolute}
#scroller .card{position:relative;margin:0 auto 22px;max-width:1180px;width:100%}
.card>header{display:flex;align-items:baseline;gap:9px;padding:9px 13px 8px;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none}
.card>header .mark{font-family:var(--display);font-weight:700;font-size:12.5px;color:var(--c);border:1px solid var(--c);
  border-radius:2px;padding:1px 5px;line-height:1.15;flex:none}
.card>header h2{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--c)}
.card>header .fr{font-family:var(--display);font-style:italic;font-weight:300;font-size:12.5px;color:var(--faint);white-space:nowrap}
.card>header .sp{margin-left:auto}
.card>header .cnt{font:600 10px var(--label);letter-spacing:.06em;color:var(--faint);white-space:nowrap}
.card>header .pr{border:none;padding:2px 4px;font-size:13px;line-height:1;opacity:.45}
.card>header .pr:hover{opacity:1}
.card .body{padding:11px 13px 13px}
.card.folded .body{display:none}
#scroller .card .body{columns:1 !important}

.grp{break-inside:avoid;margin:0 0 11px}
.grp:last-child{margin-bottom:0}
.grp>h3{margin:0 0 5px;font:700 10px/1.3 var(--label);letter-spacing:.17em;text-transform:uppercase;color:var(--soft);
  border-bottom:1px solid var(--rule);padding-bottom:3px}
.grp ul{list-style:none;margin:0;padding:0}
li.p{font-size:12.5px;line-height:1.42;padding:2px 0 2px 11px;position:relative;border-left:2px solid transparent;
  margin-left:-2px}
li.p:before{content:"";position:absolute;left:2px;top:.65em;width:4px;height:1px;background:var(--c);opacity:.75}
li.p b{font-weight:600}
li.p .n{color:var(--soft)}
li.p .ex{display:block;font-family:var(--display);font-style:italic;font-weight:300;font-size:12.5px;color:var(--c);
  opacity:.92;padding-left:1px;margin:1px 0 2px}
.lv{font:700 8.5px/1 var(--label);letter-spacing:.08em;color:var(--faint);border:1px solid var(--rule);border-radius:2px;
  padding:2px 3px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.tm{display:inline-block;width:5px;height:5px;margin:0 2px 0 5px;vertical-align:1.5px;border-radius:50%;
  border:1px solid #9A3340;background:transparent}
.tm.core{background:#9A3340}
.xl{font-style:normal;font-size:10px;color:#35657F;cursor:pointer;margin:0 1px 0 4px;vertical-align:1px;opacity:.7}
.xl:hover{opacity:1;background:rgba(53,101,127,.15)}
/* density */
body.d-terms li.p .n,body.d-terms li.p .ex,body.d-terms li.p .xl,
body.d-terms li.p .tm:not(.core){display:none}
body.d-terms li.p{line-height:1.5}
body.d-notes li.p .ex{display:none}
body.d-terms #index .nn{display:none}
li.p.dim{opacity:.16}
li.p.hit{background:rgba(168,124,43,.2);box-shadow:inset 0 0 0 1px rgba(168,124,43,.5)}
li.p.flash{animation:fl 1.8s ease-out}
@keyframes fl{0%,30%{background:rgba(53,101,127,.42);box-shadow:0 0 0 5px rgba(53,101,127,.22)}100%{background:transparent}}

/* ---------- plates ---------- */
.plate{position:absolute;background:var(--paper);border:1px solid var(--ink);padding:15px 19px;
  box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--rule);max-width:390px}
.plate h4{margin:0 0 4px;font-family:var(--display);font-size:19px;font-weight:700}
.plate .r{height:1px;background:var(--ink);margin:9px 0 10px;opacity:.25}
.plate p{margin:0 0 6px;font-size:11.5px;line-height:1.5;color:var(--soft)}
.plate p:last-child{margin-bottom:0}
.plate .k{display:flex;gap:8px;font-size:11px;margin:3px 0;color:var(--soft)}
.plate .k span:first-child{font-weight:700;color:var(--ink);flex:none;width:52px}
.eyebrow{font:400 9.5px/1 var(--label);letter-spacing:.3em;text-transform:uppercase;color:var(--faint);margin:0 0 7px !important}

/* ---------- index view ---------- */
#index{max-width:1180px;margin:0 auto}
#index h3{font:700 10px/1 var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  margin:22px 0 7px;border-bottom:1px solid var(--rule);padding-bottom:5px}
#index .row{display:flex;gap:10px;align-items:baseline;padding:4px 0 4px 11px;border-left:2px solid transparent;
  border-bottom:1px solid rgba(213,210,196,.5);font-size:13px}
#index .row .rg{font:600 9.5px var(--label);letter-spacing:.08em;text-transform:uppercase;flex:none;width:130px;color:var(--c)}
#index .row .lb{font-weight:600;flex:none;min-width:220px;max-width:340px}
#index .row .nn{color:var(--soft);flex:1;min-width:0}
#index .row.dim{display:none}

.pop{position:fixed;z-index:70;top:58px;background:var(--paper);border:1px solid var(--ink);padding:12px 14px;
  box-shadow:0 12px 32px -18px rgba(34,36,44,.8);display:none;max-width:420px}
.pop.on{display:block}
.pop .row{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.pop .row:last-child{margin-bottom:0}
.pop .eyebrow{margin:0 0 5px !important}
/* the bar needs ~1200px for a single row; below that it wraps */
@media (max-width:1200px){
  #bar{height:auto;flex-wrap:wrap;overflow:visible;padding:7px 10px;gap:6px}
  #bar .sep,#bar .lbl{display:none}
}
@media (max-width:900px){ #bar .brand{display:none} }
@media (max-width:760px){
  #q{flex:1 1 100px;width:auto;min-width:78px}
  #qn{min-width:0}
  button,.chip{padding:7px 8px;font-size:11px}
}
#toast{position:fixed;z-index:80;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  font:600 12px var(--label);letter-spacing:.04em;padding:10px 16px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}

@media print{
  #bar,#toast{display:none !important}
  body{overflow:visible;background:#fff}
  #stage{position:static;inset:auto;overflow:visible}
  #wall{position:static;overflow:visible;background:#fff}
  #scroller{position:static;overflow:visible;display:block !important;padding:0}
  .card{box-shadow:none;break-inside:avoid}
  body.pm-map #scroller{display:none !important}
  body.pm-map #wall{display:block !important}
  body.pm-region #wall{display:none !important}
  body.pm-region .card:not(.printme){display:none !important}
  body.pm-region #index,body.pm-region .plate{display:none !important}
  body.pm-map{--page:A3 landscape}
  @page{margin:8mm}
}
</style>

/* ---------- storage (degrades silently if unavailable) ---------- */

/* ---------- index the data ---------- */
DATA.forEach(r=>{ r.big = r.w >= 1900; });
const KEYMAP = {};      // cross-link key -> point id
const POINTS = [];      // flat list
DATA.forEach(r=>{
  r.groups.forEach((g,gi)=>{
    g[1].forEach((p,pi)=>{
      p.id = `${r.id}-${gi}-${pi}`;
      p.rid = r.id; p.rtitle = r.title; p.rmark = r.mark; p.c = r.c; p.gt = g[0];
      if(p.k) KEYMAP[p.k] = p.id;
      POINTS.push(p);
    });
  });
});
const BYID = Object.fromEntries(POINTS.map(p=>[p.id,p]));

/* ---------- render one point ---------- */
function pointHTML(p){
  const lv = `<span class="lv">${p.v}</span>`;
  const tr = p.t ? `<i class="tm${p.t===2?' core':''}" title="${p.t===2?'Core trap':'Common error'}"></i>` : '';
  const n  = p.n ? `<span class="n"> — ${esc(p.n)}</span>` : '';
  const e  = p.e ? `<span class="ex">${esc(p.e)}</span>` : '';
  const x  = (p.x||[]).map(k=>{
    const t = BYID[KEYMAP[k]];
    return t ? `<i class="xl" data-go="${KEYMAP[k]}" title="See: ${esc(t.l)}">&#8599;</i>` : '';
  }).join('');
  return `<li class="p" data-id="${p.id}" data-lv="${p.v}" data-t="${p.t||0}"><b>${esc(p.l)}</b>${lv}${tr}${x}${n}${e}</li>`;
}
function cardHTML(r, forColumn){
  let h = `<header><span class="mark">${r.mark}</span><h2>${esc(r.title)}</h2>`
        + `<span class="fr">${esc(r.fr)}</span><span class="sp"></span>`
        + `<span class="cnt" data-cnt="${r.id}"></span><button class="pr" data-print="${r.id}" title="Print this region">⎙</button></header>`;
  h += `<div class="body" style="columns:${forColumn?1:r.cols};column-gap:22px;column-rule:1px solid var(--rule)">`;
  r.groups.forEach(g=>{
    h += `<div class="grp"><h3>${esc(g[0])}</h3><ul>` + g[1].map(pointHTML).join('') + `</ul></div>`;
  });
  return h + `</div>`;
}

/* element lookup cache — refilter() runs on every keystroke */
let ELS = {};
function reindexEls(){
  ELS = {};
  document.querySelectorAll('[data-id]').forEach(el=>{
    const id = el.dataset.id;
    if(BYID[id]) (ELS[id] = ELS[id] || []).push(el);
  });
}
reindexEls();

let columnBuilt = false, indexBuilt = false;

  if(columnBuilt) return; columnBuilt = true;
  DATA.forEach(r=>{

/* ---------- index view ---------- */
function buildIndex(){
  if(indexBuilt) return; indexBuilt = true;
  const box = $('#index');
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                     .replace(/[^A-Za-z0-9 ]/g,'').trim().toLowerCase();
  POINTS.forEach(p=>p.sk = norm(p.l));
  const sorted = POINTS.slice().sort((a,b)=>a.sk.localeCompare(b.sk,'en') || a.l.localeCompare(b.l,'en'));
  let letter = '';
  let h = '';
  sorted.forEach(p=>{
    const L = (p.sk.charAt(0)||'#').toUpperCase();
    if(L !== letter){ letter = L; h += `<h3>${esc(letter)}</h3>`; }
    h += `<div class="row" data-id="${p.id}" data-lv="${p.v}" data-t="${p.t||0}" style="--c:${p.c}">
      <span class="rg">${esc(p.rmark)} ${esc(p.rtitle.split(' — ')[0])}</span>
      <span class="lb">${esc(p.l)}<span class="lv">${p.v}</span></span>
      <span class="nn">${esc(p.n||'')}${p.e?` <i style="font-family:var(--display);color:${p.c}">· ${esc(p.e)}</i>`:''}</span></div>`;
  });
  box.innerHTML = h;
  reindexEls(); refilter();
}

/* ---------- layout (wall) ---------- */
const GAP=34, ARM=360, PAD=140, TOP=330, BOT=300;
const DENS={ terms:{bw:1350,bc:4,mw:750 ,mc:2},
             notes:{bw:1700,bc:4,mw:950 ,mc:2},
             full :{bw:2000,bc:4,mw:1150,mc:2} };
let W=0,H=0;
function geometry(){
  const d=DENS[ST.dens]||DENS.full;
  DATA.forEach(r=>{
    r.w   = r.big ? d.bw : d.mw;
    const c = r.big ? d.bc : d.mc;
    r.el.style.width = r.w+'px';
    r.el.querySelector('.body').style.columns = c;
  });
}
function layout(){
  geometry();
  const rw=340, rh=260;
  rootEl.style.width=rw+'px'; rootEl.style.height=rh+'px';
  const L=DATA.filter(r=>r.side==='l'), Rr=DATA.filter(r=>r.side==='r');
  const hh=a=>a.reduce((s,r)=>s+r.el.offsetHeight,0)+GAP*(a.length-1);
  const hL=hh(L), hR=hh(Rr);
  const wL=Math.max(...L.map(r=>r.w)), wR=Math.max(...Rr.map(r=>r.w));
  const contentH=Math.max(hL,hR,rh);
  H=TOP+contentH+BOT; W=wL+ARM*2+rw+wR+PAD*2;
  const cx=PAD+wL+ARM+rw/2, cy=TOP+contentH/2;
  rootEl.style.left=(cx-rw/2)+'px'; rootEl.style.top=(cy-rh/2)+'px';
  const iR=cx+rw/2+ARM, iL=cx-rw/2-ARM;
  let y=cy-hL/2; L.forEach(r=>{ r.el.style.left=(iL-r.w)+'px'; r.el.style.top=y+'px'; r.a=[iL,y+22]; y+=r.el.offsetHeight+GAP; });
  y=cy-hR/2;   Rr.forEach(r=>{ r.el.style.left=iR+'px';        r.el.style.top=y+'px'; r.a=[iR,y+22]; y+=r.el.offsetHeight+GAP; });
  cart.style.left=PAD+'px'; cart.style.top='40px';
  leg.style.left=PAD+'px';  leg.style.top=(H-BOT+40)+'px';
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  edges.setAttribute('viewBox',`0 0 ${W} ${H}`); edges.setAttribute('width',W); edges.setAttribute('height',H);
  edges.innerHTML='';
  DATA.forEach(r=>{
    const [tx,ty]=r.a, ang=Math.atan2(ty-cy,tx-cx);
    const sx=cx+Math.cos(ang)*(rw/2)*.98, sy=cy+Math.sin(ang)*(rh/2)*.98;
    const t1=8,t2=2,d=(tx-sx)*.55;
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M ${sx} ${sy-t1} C ${sx+d} ${sy-t1}, ${tx-d} ${ty-t2}, ${tx} ${ty-t2} L ${tx} ${ty+t2} C ${tx-d} ${ty+t2}, ${sx+d} ${sy+t1}, ${sx} ${sy+t1} Z`);
    p.setAttribute('fill',r.c); p.setAttribute('opacity',r.dashed?.3:.62); edges.appendChild(p);
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',tx); c.setAttribute('cy',ty); c.setAttribute('r',4);
    c.setAttribute('fill','var(--paper)'); c.setAttribute('stroke',r.c); c.setAttribute('stroke-width',2); edges.appendChild(c);
  });
}

/* ---------- pan / zoom ---------- */
const wall=$('#wall'); let scale=1, ox=0, oy=0;
let zsave=null;
function apply(){
  canvas.style.transform=`translate3d(${ox}px,${oy}px,0) scale(${scale})`;
  clearTimeout(zsave);
  zsave=setTimeout(()=>{ ST.z={s:scale,x:ox,y:oy}; save(); }, 400);
}
// is any of the map actually on screen? guards against a stale or rotated-away viewport
function onScreen(){
  const w=wall.clientWidth, h=wall.clientHeight;
  return scale>0.01 && scale<=3 && ox<w && oy<h && ox+W*scale>0 && oy+H*scale>0;
}
function restoreView(){
  const z=ST.z;
  if(z && [z.s,z.x,z.y].every(n=>typeof n==='number' && isFinite(n))){
    scale=z.s; ox=z.x; oy=z.y; apply();
    if(!onScreen()) fit();
  } else fit();
}
function fit(){ const w=wall.clientWidth,h=wall.clientHeight; scale=Math.min(w/(W+80),h/(H+80)); ox=(w-W*scale)/2; oy=(h-H*scale)/2; apply(); }
function zoomAt(f,px,py){ const n=Math.min(3,Math.max(.04,scale*f)); ox=px-(px-ox)*(n/scale); oy=py-(py-oy)*(n/scale); scale=n; apply(); }
function centerOn(el,z){
  const r=el.getBoundingClientRect(), wr=wall.getBoundingClientRect();
  const cxp=(r.left-wr.left-ox)/scale + r.width/(2*scale), cyp=(r.top-wr.top-oy)/scale + r.height/(2*scale);
  scale=z||Math.max(scale,.55); ox=wall.clientWidth/2-cxp*scale; oy=wall.clientHeight/2-cyp*scale; apply();
}
wall.addEventListener('wheel',e=>{ e.preventDefault(); const r=wall.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top); },{passive:false});
let drag=false,lx=0,ly=0,sx=0,sy=0,moved=false,pid=null;
const MOVED=4;
/* coalesce moves to one transform per frame — touch fires far faster than 60Hz */
let raf=0,pendX=0,pendY=0;
function schedulePan(){
  if(raf) return;
  raf=requestAnimationFrame(()=>{ raf=0; ox+=pendX; oy+=pendY; pendX=pendY=0; apply(); });
}
function flushPan(){
  if(raf){ cancelAnimationFrame(raf); raf=0; }
  if(pendX||pendY){ ox+=pendX; oy+=pendY; pendX=pendY=0; apply(); }
}                 // px of travel before a press counts as a pan, not a tap
const pts=new Map();           // live pointers, so two fingers can pinch
let pinchD=0, pinchM=null, lastTap=0;
const midOf=(a,b)=>{ const r=wall.getBoundingClientRect();
  return {x:(a.x+b.x)/2-r.left, y:(a.y+b.y)/2-r.top}; };

let holdTimer=null, selGesture=false;
const HOLD=400;                // ms of stillness before the press becomes a selection
wall.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse' && e.button) return;
  selGesture=false; clearTimeout(holdTimer);
  holdTimer=setTimeout(()=>{   // held still: stop competing, let the browser select
    if(!moved){ selGesture=true; drag=false; pts.clear(); wall.classList.remove('drag'); }
  }, HOLD);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ drag=true; moved=false; lx=sx=e.clientX; ly=sy=e.clientY; pid=e.pointerId; }
  else if(pts.size===2){
    drag=false; wall.classList.remove('drag'); moved=true;   // a pinch is never a tap
    const [a,b]=[...pts.values()];
    pinchD=Math.hypot(a.x-b.x,a.y-b.y); pinchM=midOf(a,b);
  }
});

wall.addEventListener('pointermove',e=>{
  if(selGesture || !pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pts.size>=2){                                   // pinch: zoom about the midpoint, and track it
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), m=midOf(a,b);
    if(pinchD>0 && d>0) zoomAt(d/pinchD, m.x, m.y);
    if(pinchM){ ox+=m.x-pinchM.x; oy+=m.y-pinchM.y; apply(); }
    pinchD=d; pinchM=m;
    return;
  }
  if(!drag) return;
  if(!moved && Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>MOVED){
    moved=true; clearTimeout(holdTimer);
    wall.classList.add('drag'); document.body.classList.add('panning');
    const sel=window.getSelection && window.getSelection(); if(sel) sel.removeAllRanges();
    try{ wall.setPointerCapture(pid); }catch(_){}   // capture only once a real pan begins
    pendX+=e.clientX-sx; pendY+=e.clientY-sy;       // keep the travel already made
  } else if(moved){
    pendX+=e.clientX-lx; pendY+=e.clientY-ly;
  }
  lx=e.clientX; ly=e.clientY;
  if(moved) schedulePan();
});

['pointerup','pointercancel'].forEach(t=>wall.addEventListener(t,e=>{
  clearTimeout(holdTimer); flushPan(); document.body.classList.remove('panning');
  if(selGesture){ selGesture=false; drag=false; return; }
  // double-tap to zoom in, but not on a control
  if(t==='pointerup' && e.pointerType!=='mouse' && !moved && pts.size===1
     && !e.target.closest('header,.xl')){
    const now=Date.now(), r=wall.getBoundingClientRect();
    if(now-lastTap<300){ zoomAt(1.8, e.clientX-r.left, e.clientY-r.top); lastTap=0; }
    else lastTap=now;
  }
  pts.delete(e.pointerId);
  if(pts.size<2){ pinchD=0; pinchM=null; }
  if(pts.size===1){                                   // one finger lifted mid-pinch: resume panning
    const [id,a]=[...pts.entries()][0];
    pid=id; lx=a.x; ly=a.y; drag=true;
  }
  if(pts.size===0){ drag=false; wall.classList.remove('drag'); }
}));
// a pan must not trigger the fold / cross-link handlers underneath it
wall.addEventListener('click',e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } }, true);
$('#zi').onclick=()=>zoomAt(1.2,wall.clientWidth/2,wall.clientHeight/2);
$('#zo').onclick=()=>zoomAt(1/1.2,wall.clientWidth/2,wall.clientHeight/2);
$('#fit').onclick=fit;

/* ---------- views ---------- */
function setView(v){
  if(v==='column') buildColumn();
  if(v==='index'){ buildColumn(); buildIndex(); }
  document.body.dataset.view=v; ST.view=v; save();
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#zoomg').style.display = v==='wall' ? '' : 'none';
  document.querySelectorAll('#scroller .card').forEach(c=>c.style.display = v==='column' ? '' : 'none');
  $('#index').style.display = v==='index' ? '' : 'none';
  if(v==='wall'){ layout(); restoreView(); }
}
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

/* ---------- study state ---------- */
function counts(){
  DATA.forEach(r=>{
    const tot=r.groups.reduce((n,g)=>n+g[1].length,0);
    document.querySelectorAll(`[data-cnt="${r.id}"]`).forEach(e=>e.textContent=`${tot} points`);
  });
}
document.addEventListener('click',e=>{
  const xl=e.target.closest('.xl');
  if(xl){ e.stopPropagation(); goTo(xl.dataset.go); return; }
  const pr=e.target.closest('[data-print]');
  if(pr){ e.stopPropagation(); printRegion(pr.dataset.print); return; }
  const hd=e.target.closest('.card>header');
  if(hd){ const c=hd.parentElement, id=c.dataset.id;
    c.classList.toggle('folded');
    document.querySelectorAll(`.card[data-id="${id}"]`).forEach(x=>x.classList.toggle('folded',c.classList.contains('folded')));
    ST.fold[id]=c.classList.contains('folded'); save();
    if(document.body.dataset.view==='wall'){ layout(); } return; }
});

/* ---------- cross-link navigation ---------- */
function goTo(id){
  const p=BYID[id]; if(!p) return;
  if(document.body.dataset.view!=='wall') setView('wall');
  const card=canvas.querySelector(`.card[data-id="${p.rid}"]`);
  if(card.classList.contains('folded')){
    document.querySelectorAll(`.card[data-id="${p.rid}"]`).forEach(x=>x.classList.remove('folded'));
    ST.fold[p.rid]=false; save(); layout();
  }
  const el=canvas.querySelector(`li.p[data-id="${id}"]`);
  centerOn(el,.85);
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

/* ---------- filters & search ---------- */
const lv=new Set(); let fCore=false,fTrap=false;
const levelBox=$('#levels');
LEVELS.forEach(l=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=l;
  b.onclick=()=>{ lv.has(l)?lv.delete(l):lv.add(l); b.classList.toggle('on'); refilter(); }; levelBox.appendChild(b); });
const tog=(id,get,set)=>{ const b=$(id); b.onclick=()=>{ set(!get()); b.classList.toggle('on',get()); refilter(); }; };
tog('#fCore',()=>fCore,v=>fCore=v); tog('#fTrap',()=>fTrap,v=>fTrap=v);

let hits=[], hi=-1;
$('#q').addEventListener('input',()=>{ hi=-1; refilter(); });
function refilter(){
  const q=$('#q').value.trim().toLowerCase();
  hits=[];
  POINTS.forEach(p=>{
    let ok = (!lv.size || lv.has(p.v))
          && (!fCore || p.t===2)
          && (!fTrap || !!p.t);
    const txt=(p.l+' '+(p.n||'')+' '+(p.e||'')+' '+p.gt).toLowerCase();
    const hit = q && txt.includes(q);
    if(ok && hit) hits.push(p.id);
    (ELS[p.id]||[]).forEach(el=>{
      el.classList.toggle('dim', !ok || (q && !hit));
      el.classList.toggle('hit', !!hit && ok);
    });
  });
  $('#qn').textContent = q ? (hits.length ? `${Math.max(hi,0)+1}/${hits.length}` : '0') : '';
}
function step(d){ if(!hits.length) return; hi=(hi+d+hits.length)%hits.length; $('#qn').textContent=`${hi+1}/${hits.length}`;
  if(document.body.dataset.view==='wall'){ const el=canvas.querySelector(`li.p[data-id="${hits[hi]}"]`); if(el) centerOn(el,.85); }
  else { const el=scroller.querySelector(`[data-id="${hits[hi]}"]`); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); } }
$('#qx').onclick=()=>step(1); $('#qp').onclick=()=>step(-1);
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); step(e.shiftKey?-1:1);} });

/* ---------- examples, print, data ---------- */
function setDens(d){
  ST.dens=d; save();
  document.body.classList.remove('d-terms','d-notes','d-full');
  document.body.classList.add('d-'+d);
  document.querySelectorAll('#dens button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  if(document.body.dataset.view==='wall'){ layout(); fit(); }
}
document.querySelectorAll('#dens button').forEach(b=>b.onclick=()=>setDens(b.dataset.d));
function printRegion(id){
  buildColumn();
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('printme', c.dataset.id===id && c.parentElement===scroller));
  document.body.classList.add('pm-region');
  const prev=document.body.dataset.view; document.body.dataset.view='column';
  window.onafterprint=()=>{ document.body.classList.remove('pm-region'); document.body.dataset.view=prev; window.onafterprint=null; };
  window.print();
}
$('#prt').onclick=()=>{
  if(document.body.dataset.view==='wall'){ fit(); document.body.classList.add('pm-map');
    window.onafterprint=()=>{document.body.classList.remove('pm-map');window.onafterprint=null;}; }
  window.print();
};
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }

function popup(btn,pop){
  const b=$(btn), p=$(pop);
  b.onclick=e=>{ e.stopPropagation();
    const open=p.classList.contains('on');
    document.querySelectorAll('.pop').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('#mFilter,#mMore').forEach(x=>x.classList.remove('on'));
    if(!open){ p.classList.add('on'); b.classList.add('on');
      p.style.left=Math.min(b.getBoundingClientRect().left, innerWidth-p.offsetWidth-12)+'px'; } };
}
popup('#mFilter','#pFilter'); popup('#mMore','#pMore');
document.addEventListener('click',e=>{ if(!e.target.closest('.pop,#mFilter,#mMore')){
  document.querySelectorAll('.pop').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('#mFilter,#mMore').forEach(x=>x.classList.remove('on')); } });

addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return;
  if(e.key==='+'||e.key==='=') $('#zi').click(); if(e.key==='-') $('#zo').click();
  if(e.key==='0') fit(); if(e.key==='/'){ e.preventDefault(); $('#q').focus(); } });

/* ---------- go ---------- */
function boot(){
  fitBar();
  Object.keys(ST.fold||{}).forEach(id=>{ if(ST.fold[id]) document.querySelectorAll(`.card[data-id="${id}"]`).forEach(c=>c.classList.add('folded')); });
  counts();
  setDens(ST.dens||'full');
  setView(ST.view||'wall'); refilter();
}
const densSlot=document.createComment('dens');
function responsiveBar(){
  const g=$('#gDens'), host=$('#densHost'), sec=$('#densSection');
  if(!densSlot.parentNode) g.parentNode.insertBefore(densSlot, g.nextSibling);
  const narrow = innerWidth<=760;
  if(narrow && g.parentElement!==host){ host.appendChild(g); sec.style.display=''; }
  else if(!narrow && g.parentElement===host){ densSlot.parentNode.insertBefore(g,densSlot); sec.style.display='none'; }
}
function fitBar(){
  responsiveBar();
  const h=$('#bar').offsetHeight;
  $('#stage').style.top=h+'px';
  document.querySelectorAll('.pop').forEach(p=>p.style.top=(h+6)+'px');
}
function reveal(){ document.body.classList.add('ready'); }
boot();                                    // lay out immediately with fallback metrics
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ boot(); reveal(); });   // re-measure once the real fonts are in
} else {
  addEventListener('load',()=>{ boot(); reveal(); });
}
setTimeout(reveal, 1200);                  // safety net if the font promise never settles
addEventListener('resize',()=>{
  fitBar();
  if(document.body.dataset.view==='wall'){ layout(); apply(); if(!onScreen()) fit(); }
});
</script>
</html>
